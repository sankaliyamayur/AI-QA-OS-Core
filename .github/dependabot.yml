# SEC-5: always-on dependency + GitHub Actions update alerts/PRs for the Core (Maven) repo.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    # The springdoc major-version ignore that used to sit here is gone, as its own comment
    # instructed: it existed only because springdoc 3.x requires Spring Boot 4 while the
    # platform was on 3.3.0 (see PR #6 and ADR-092). The platform is on Boot 4.1.0 and
    # springdoc 3.1.0 now, so keeping it would silently pin us to a 2.x line that does not
    # work here at all — on Boot 4, springdoc 2.5.0 serves /v3/api-docs as HTTP 500.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
