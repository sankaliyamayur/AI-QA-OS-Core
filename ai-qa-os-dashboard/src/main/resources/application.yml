server:
  port: 8090

# MNT-6 + OBS-1: surface the MDC correlationId and traceId on every log line (log↔trace correlation).
logging:
  pattern:
    level: "%5p [%X{correlationId:-}] [%X{traceId:-}]"

spring:
  application:
    name: ai-qa-os-dashboard
  datasource:
    url: jdbc:postgresql://localhost:5432/ai_qa_os_dashboard?preferQueryMode=simple
    # SEC-2: credentials injected from env/secret store; no committed default for the password.
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

# SEC-2: JWT signing secret injected from env/secret store (no committed value).
# Required when aiqaos.security.enabled=true; otherwise a non-persistent ephemeral key is used.
security:
  jwt:
    secret: ${JWT_SECRET:}

aiqaos:
  security:
    # SEC-1: deny-by-default authentication enforcement. Override to false (e.g. via
    # AIQAOS_SECURITY_ENABLED=false) for open local development.
    enabled: ${AIQAOS_SECURITY_ENABLED:true}
    database-enabled: true
    # SEC-1: bootstrap admin is created only if absent and a password is supplied here (inject via
    # env/secret, never commit a real value — full secret management is SEC-2).
    bootstrap-admin:
      username: ${AIQAOS_BOOTSTRAP_ADMIN_USERNAME:admin}
      email: ${AIQAOS_BOOTSTRAP_ADMIN_EMAIL:admin@aiqaos.local}
      password: ${AIQAOS_BOOTSTRAP_ADMIN_PASSWORD:}
  artifacts:
    # Base directory where Playwright writes screenshots, videos, traces, and reports.
    # Override via PLAYWRIGHT_ARTIFACTS_DIR environment variable in CI/CD.
    base-dir: ${PLAYWRIGHT_ARTIFACTS_DIR:D:/QA AI Automation/AI-QA-OS Architecture/AI-QA-OS-Core/playwright-output}
  playwright:
    # Path to run-playwright.ps1 script; leave empty to use classpath resource resolution.
    runner-script: ${PLAYWRIGHT_RUNNER_SCRIPT:}
  dashboard:
    # Public base URL used to construct HTTP URLs for artifact file serving.
    base-url: ${DASHBOARD_BASE_URL:http://localhost:8090}
