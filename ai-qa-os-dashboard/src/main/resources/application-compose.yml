# Phase 1 (Checkpoint 2 / T3-T4): run the dashboard locally against the docker-compose Postgres.
#
# Activate with:  SPRING_PROFILES_ACTIVE=compose
# Same datasource as the gateway (both apps share the ai_qa_os_dashboard schema), but the dashboard
# is NOT a Flyway owner — the gateway performs all migrations (ADR-024), so the dashboard only reads
# the already-migrated schema and validates against it. Boot the gateway FIRST so V1..V16 exist.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_qa_os_dashboard?preferQueryMode=simple}
    username: ${SPRING_DATASOURCE_USERNAME:qaosuser}
    password: ${SPRING_DATASOURCE_PASSWORD:qaoslocaldev}
  jpa:
    hibernate:
      ddl-auto: validate            # validates against the gateway-migrated schema; never generates
  flyway:
    enabled: false                  # dashboard is NOT the migration owner (ADR-024) — no dual migrate

aiqaos:
  security:
    # Frictionless local dev by default; set AIQAOS_SECURITY_ENABLED=true to exercise SEC-1 auth.
    enabled: ${AIQAOS_SECURITY_ENABLED:false}
  eval:
    regression:
      alerts:
        # FI-PE3-D: default OFF — upgrading never starts sending alerts. Set
        # AIQAOS_REGRESSION_ALERTS_ENABLED=true and newly-detected prompt-quality regressions
        # (FI-PE3-B detection over eval_results) are pushed through ENT-2's governed notification
        # path as PROMPT_REGRESSION events. Alerts fire on transitions only: a persistent regression
        # is reported once, and re-alerts only if the version recovers and regresses again.
        enabled: ${AIQAOS_REGRESSION_ALERTS_ENABLED:false}
        cron: ${AIQAOS_REGRESSION_ALERTS_CRON:0 0 8 * * *}
        recipient: ${AIQAOS_REGRESSION_ALERTS_RECIPIENT:qa-leads}
  notification:
    # ENT-2: channel used when an event doesn't name one (senders are simulated — MOD-2/FI-MOD2-B).
    default-channel: ${AIQAOS_NOTIFICATION_DEFAULT_CHANNEL:SLACK}
  artifacts:
    # ENT-5 (ADR-068): the dashboard SERVES durable artifacts via ArtifactController#serveFromStore
    # (/api/artifacts/store/**), so it needs the same object-store config as the gateway that uploads
    # them. Default stays local; set AIQAOS_ARTIFACTS_STORE=object + OBJECT_PROVIDER=s3 with MinIO up.
    store: ${AIQAOS_ARTIFACTS_STORE:local}
    object:
      provider: ${AIQAOS_ARTIFACTS_OBJECT_PROVIDER:in-memory}
      s3:
        # SEC-2: creds from env/.env (MinIO dev defaults), never committed. MinIO needs path-style.
        bucket: ${AIQAOS_ARTIFACTS_S3_BUCKET:aiqaos-artifacts}
        endpoint: ${AIQAOS_ARTIFACTS_S3_ENDPOINT:http://localhost:9000}
        region: ${AIQAOS_ARTIFACTS_S3_REGION:us-east-1}
        access-key: ${AIQAOS_ARTIFACTS_S3_ACCESS_KEY:${MINIO_ROOT_USER:minioadmin}}
        secret-key: ${AIQAOS_ARTIFACTS_S3_SECRET_KEY:${MINIO_ROOT_PASSWORD:minioadmin}}
        path-style-access: true
