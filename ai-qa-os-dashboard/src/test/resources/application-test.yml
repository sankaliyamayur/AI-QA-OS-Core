spring:
  datasource:
    url: jdbc:h2:mem:dashboard_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

aiqaos:
  security:
    # SEC-1: keep the dashboard slice/integration tests on the permissive chain.
    enabled: false

security:
  jwt:
    # SEC-2: test-only deterministic signing key. NOT a real secret.
    secret: test-only-non-production-hmac-signing-key-do-not-use-in-any-real-environment
