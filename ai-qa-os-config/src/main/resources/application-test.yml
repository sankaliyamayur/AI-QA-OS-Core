spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

aiqaos:
  application:
    environment: test
  security:
    enabled: false
  features:
      realtime-logging: false

security:
  jwt:
    # SEC-2: test-only deterministic signing key. NOT a real secret and never used outside tests.
    secret: test-only-non-production-hmac-signing-key-do-not-use-in-any-real-environment
    expirationMs: 3600000
    refreshExpirationMs: 86400000
    issuer: ai-qa-os-auth-service