# AI-QA-OS — local infrastructure (Phase 1).
#
# Default `docker compose up -d` brings up the INFRA only (postgres, redis, qdrant, kafka, minio,
# otel). Run the Spring apps locally on the `compose` profile (they target localhost:<port>), or
# bring up the containerised gateway with `--profile apps`. Inspection UIs: `--profile tools`.
#
# Credentials come from a local `.env` (see .env.example). The Postgres password has a dev-only
# default so `up` works out of the box; override it in `.env` for anything shared.

services:
  postgres:
    image: postgres:16-alpine
    container_name: qaos-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_qa_os_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-qaosuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qaoslocaldev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qaosuser} -d ${POSTGRES_DB:-ai_qa_os_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qaos-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: qaos-qdrant
    ports:
      - "6333:6333"   # HTTP / REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  kafka:
    image: apache/kafka:3.8.0
    container_name: qaos-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio
    container_name: qaos-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: create the platform buckets, then exit 0.
  minio-createbuckets:
    image: minio/mc
    container_name: qaos-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/aiqaos-artifacts local/aiqaos-backups &&
      echo 'buckets ready' &&
      exit 0"

  otel-collector:
    image: otel/opentelemetry-collector:0.95.0
    container_name: qaos-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # gRPC receiver
      - "4318:4318"   # HTTP receiver

  # ----- Containerised app (optional): `docker compose --profile apps up -d` -----
  gateway:
    profiles: ["apps"]
    build:
      context: ../../
      dockerfile: deployment/docker/gateway.Dockerfile
    container_name: qaos-gateway
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=compose
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ai_qa_os_dashboard}?preferQueryMode=simple
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-qaosuser}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-qaoslocaldev}
      - SPRING_DATA_REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - KAFKA_BOOTSTRAP=kafka:9092
      - MINIO_ENDPOINT=http://minio:9000
      - AIQAOS_SECURITY_ENABLED=${AIQAOS_SECURITY_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ----- Inspection UIs (optional): `docker compose --profile tools up -d` -----
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["tools"]
    container_name: qaos-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

volumes:
  postgres_data:
  qdrant_data:
  kafka_data:
  minio_data:
