# AI-QA-OS — minimal OpenTelemetry Collector config for local dev (mounted by docker-compose.yml).
# Receives OTLP (gRPC 4317 / HTTP 4318) from the apps and logs to the collector's stdout. This is a
# dev sink so the stack starts cleanly; point the exporters at a real backend (Tempo/Jaeger/Prometheus)
# for anything beyond local inspection.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
