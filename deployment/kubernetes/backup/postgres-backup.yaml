# ENT-5 / FI-ENT5-B (ADR-074): nightly PostgreSQL backup -> object storage.
#
# Runnable once `aiqaos-backup-secret` (see backup-secret.yaml) exists and the DB name/user/host below
# match your deployment (databases/postgres.yaml). pg_dump runs in an initContainer writing to a shared
# emptyDir; the main container uploads via aws-cli (works against MinIO via --endpoint-url and real AWS
# S3 when S3_ENDPOINT is empty). No plaintext credentials — all from the Secret.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: ai-qa-os
  labels:
    app: aiqaos
    component: backup
spec:
  schedule: "0 2 * * *"            # daily 02:00
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: dump
              emptyDir: {}
          initContainers:
            - name: pg-dump
              image: postgres:16-alpine
              command: ["/bin/sh", "-c"]
              args:
                - >
                  set -eu;
                  TS=$(date +%Y%m%d-%H%M%S);
                  PGPASSWORD="$POSTGRES_PASSWORD" pg_dump -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f "/dump/pg-$TS.dump";
                  echo "pg_dump complete: /dump/pg-$TS.dump"
              env:
                - name: POSTGRES_HOST
                  value: postgres-service           # match databases/postgres.yaml Service
                - name: POSTGRES_DB
                  value: ai_qa_os_dashboard          # match the deployed DB name (ADR-053 reconciled)
                - name: POSTGRES_USER
                  value: qaosuser
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: aiqaos-backup-secret
                      key: POSTGRES_PASSWORD
              volumeMounts:
                - name: dump
                  mountPath: /dump
          containers:
            - name: upload
              image: amazon/aws-cli:2.17.0
              command: ["/bin/sh", "-c"]
              args:
                - >
                  set -eu;
                  EP="";
                  if [ -n "${S3_ENDPOINT:-}" ]; then EP="--endpoint-url $S3_ENDPOINT"; fi;
                  aws $EP s3 cp /dump/ "$BACKUP_BUCKET/postgres/" --recursive --only-show-errors;
                  echo "Uploaded Postgres dump(s) to $BACKUP_BUCKET/postgres/"
              envFrom:
                - secretRef:
                    name: aiqaos-backup-secret       # AWS_ACCESS_KEY_ID/SECRET, S3_ENDPOINT, BACKUP_BUCKET
              volumeMounts:
                - name: dump
                  mountPath: /dump
