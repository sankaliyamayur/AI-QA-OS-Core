# ENT-5: nightly PostgreSQL backup -> object storage.
# TEMPLATE — not runnable without a cluster + object-storage credentials (deferred, ENT-5 §0.3).
# Set BACKUP_BUCKET and provide S3/GCS creds via the referenced secret; move DB creds to a Secret
# (they mirror the current plaintext deployment today — see FI-SEC/FI-ENT5).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: ai-qa-os
spec:
  schedule: "0 2 * * *"            # daily 02:00
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-backup
              image: postgres:16-alpine
              command: ["/bin/sh", "-c"]
              args:
                - >
                  set -e;
                  TS=$(date +%Y%m%d-%H%M%S);
                  PGPASSWORD="$POSTGRES_PASSWORD" pg_dump -h postgres-service -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f /tmp/pg-$TS.dump;
                  echo "Upload /tmp/pg-$TS.dump to $BACKUP_BUCKET (aws s3 cp / mc cp) using the object-storage secret";
              env:
                - name: POSTGRES_DB
                  value: ai_qa_os
                - name: POSTGRES_USER
                  value: qaosuser
                - name: POSTGRES_PASSWORD
                  value: qaossecurepassword   # TODO: move to a Secret (matches current deployment)
                - name: BACKUP_BUCKET
                  value: s3://REPLACE-ME/postgres
