# ENT-5 / FI-ENT5-B (ADR-074): nightly artifact-tree backup -> object storage.
#
# NOTE ON SCOPE: with the object-storage ArtifactStore as primary (aiqaos.artifacts.store=object +
# object.provider=s3) and upload enabled (FI-ENT5-A/ADR-071), execution workers already write
# artifacts to object storage, so the durable copy exists without this job. This CronJob covers the
# LEGACY local-PVC deployment (store=local) — it syncs the on-disk artifact tree to the backup bucket.
# Age-based purge is handled in-app by ArtifactRetentionService (opt-in) or a bucket lifecycle rule.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: artifacts-backup
  namespace: ai-qa-os
  labels:
    app: aiqaos
    component: backup
spec:
  schedule: "0 3 * * *"            # daily 03:00
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: artifacts-sync
              image: amazon/aws-cli:2.17.0
              command: ["/bin/sh", "-c"]
              args:
                - >
                  set -eu;
                  EP="";
                  if [ -n "${S3_ENDPOINT:-}" ]; then EP="--endpoint-url $S3_ENDPOINT"; fi;
                  aws $EP s3 sync /playwright-output "$BACKUP_BUCKET/artifacts/" --only-show-errors;
                  echo "Synced /playwright-output to $BACKUP_BUCKET/artifacts/"
              envFrom:
                - secretRef:
                    name: aiqaos-backup-secret       # AWS_ACCESS_KEY_ID/SECRET, S3_ENDPOINT, BACKUP_BUCKET
              volumeMounts:
                - name: artifacts
                  mountPath: /playwright-output
                  readOnly: true
          volumes:
            - name: artifacts
              persistentVolumeClaim:
                claimName: artifacts-pvc   # match the execution artifact volume (local-store deployments)
