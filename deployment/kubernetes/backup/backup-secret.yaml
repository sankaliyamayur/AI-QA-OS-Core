# ENT-5 / FI-ENT5-B (ADR-074): credentials + targets for the backup CronJobs.
#
# SEC-2: this is a TEMPLATE — do NOT commit real values. Create the real Secret out-of-band, e.g.
#   kubectl -n ai-qa-os create secret generic aiqaos-backup-secret \
#     --from-literal=AWS_ACCESS_KEY_ID=... --from-literal=AWS_SECRET_ACCESS_KEY=... \
#     --from-literal=S3_ENDPOINT=http://minio-service:9000 \
#     --from-literal=BACKUP_BUCKET=s3://aiqaos-backups \
#     --from-literal=POSTGRES_PASSWORD=...
# (or seal it with sealed-secrets / external-secrets). S3_ENDPOINT is set for MinIO / any
# S3-compatible store and left EMPTY for real AWS S3. BACKUP_BUCKET is the base; each job writes a
# subpath (postgres/ artifacts/ qdrant/).
apiVersion: v1
kind: Secret
metadata:
  name: aiqaos-backup-secret
  namespace: ai-qa-os
  labels:
    app: aiqaos
    component: backup
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: REPLACE_ME
  AWS_SECRET_ACCESS_KEY: REPLACE_ME
  S3_ENDPOINT: "http://minio-service:9000"   # MinIO in-cluster; set "" for real AWS S3
  BACKUP_BUCKET: "s3://aiqaos-backups"        # base bucket (must already exist)
  POSTGRES_PASSWORD: REPLACE_ME
