# SEC-6 / FI-SEC6-B (ADR-091): keystores for service-to-service mTLS.
#
# NEVER COMMIT REAL KEYSTORES (SEC-2). This is a template: create the Secret out-of-band from
# material your CA issues, e.g.
#
#   kubectl -n ai-qa-os create secret generic aiqaos-mtls-secret \
#     --from-file=gateway-keystore.p12=./gateway-keystore.p12 \
#     --from-file=gateway-truststore.p12=./gateway-truststore.p12 \
#     --from-file=dashboard-keystore.p12=./dashboard-keystore.p12 \
#     --from-file=dashboard-truststore.p12=./dashboard-truststore.p12 \
#     --from-literal=AIQAOS_MTLS_PASSWORD='<password>'
#
# For local development only, deployment/local/generate-mtls-certs.ps1 produces the same four
# keystores from a throwaway CA.
apiVersion: v1
kind: Secret
metadata:
  name: aiqaos-mtls-secret
  namespace: ai-qa-os
  labels:
    app: aiqaos
    component: mtls
type: Opaque
stringData:
  AIQAOS_MTLS_PASSWORD: REPLACE_ME
# The four .p12 entries are intentionally absent here — binary key material belongs in `data:` created
# by the command above, not in a file under version control.
