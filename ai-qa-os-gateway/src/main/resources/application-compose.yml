# Phase 1 (Checkpoint 2 / T3-T4): run the gateway locally against the docker-compose Postgres.
#
# Activate with:  SPRING_PROFILES_ACTIVE=compose
# It supplies dev-matching datasource credentials (so no env is required to connect to the compose
# Postgres), keeps the gateway as the sole Flyway migration owner (ADR-024), and points short-term
# memory at the compose Redis. The vector store stays on the in-memory default: the QdrantStoreClient
# is still a no-op stub (real Qdrant binding is deferred to SCALE-3 completion), so switching to it
# would DEGRADE dev, not improve it. Kafka/MinIO Java bindings are likewise deferred until a real
# consumer exists (see Checkpoint 3 notes) — the containers are up and ready for when they land.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_qa_os_dashboard?preferQueryMode=simple}
    username: ${SPRING_DATASOURCE_USERNAME:qaosuser}
    password: ${SPRING_DATASOURCE_PASSWORD:qaoslocaldev}
  jpa:
    hibernate:
      ddl-auto: validate            # schema is owned by Flyway migrations, never auto-generated
  flyway:
    enabled: true                   # gateway OWNS the canonical schema migrations (V1..V16), ADR-024
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost} # compose Redis; RedisMemoryStore degrades gracefully if down
      port: ${REDIS_PORT:6379}

aiqaos:
  memory:
    shortterm:
      provider: redis               # T5: RedisMemoryStore (starter present via brain->memory);
                                     # Spring Boot's auto RedisHealthIndicator surfaces it at /actuator/health
    vector:
      provider: in-memory           # QdrantStoreClient is a stub — keep the validated in-memory store
  security:
    # Frictionless local dev by default; set AIQAOS_SECURITY_ENABLED=true to exercise SEC-1 auth.
    enabled: ${AIQAOS_SECURITY_ENABLED:false}
