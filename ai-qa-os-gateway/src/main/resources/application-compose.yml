# Phase 1 (Checkpoint 2 / T3-T4): run the gateway locally against the docker-compose Postgres.
#
# Activate with:  SPRING_PROFILES_ACTIVE=compose
# It supplies dev-matching datasource credentials (so no env is required to connect to the compose
# Postgres), keeps the gateway as the sole Flyway migration owner (ADR-024), and points short-term
# memory at the compose Redis. The vector store stays on the in-memory default: the QdrantStoreClient
# is still a no-op stub (real Qdrant binding is deferred to SCALE-3 completion), so switching to it
# would DEGRADE dev, not improve it. The distributed EventBus over Kafka (SCALE-2 / ADR-064) is now
# available but OPT-IN — set AIQAOS_EVENTS_TRANSPORT=kafka to enable it. The durable object store over the
# compose MinIO (ENT-5 / ADR-068) is likewise OPT-IN — set AIQAOS_ARTIFACTS_STORE=object with
# AIQAOS_ARTIFACTS_OBJECT_PROVIDER=s3 (S3 creds below) to use it; default stays the local single-host store.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ai_qa_os_dashboard?preferQueryMode=simple}
    username: ${SPRING_DATASOURCE_USERNAME:qaosuser}
    password: ${SPRING_DATASOURCE_PASSWORD:qaoslocaldev}
  jpa:
    hibernate:
      ddl-auto: validate            # schema is owned by Flyway migrations, never auto-generated
  flyway:
    enabled: true                   # gateway OWNS the canonical schema migrations (V1..V16), ADR-024
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost} # compose Redis; RedisMemoryStore degrades gracefully if down
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092} # only used when events.transport=kafka
    consumer:
      auto-offset-reset: latest

aiqaos:
  events:
    # SCALE-2 (ADR-064): default in-process. Set AIQAOS_EVENTS_TRANSPORT=kafka (with the compose Kafka
    # up) to run the distributed EventBus — a BaseEvent published on one instance reaches all instances.
    transport: ${AIQAOS_EVENTS_TRANSPORT:in-process}
  execution:
    queue:
      # SCALE-1 (ADR-065): default OFF (inline execution, unchanged). Set AIQAOS_EXECUTION_QUEUE_ENABLED=true
      # (provider defaults redis) with the compose Redis up to distribute execution jobs across instances
      # via Redis Streams — any worker picks up any job; results return to the submitter.
      enabled: ${AIQAOS_EXECUTION_QUEUE_ENABLED:false}
      provider: ${AIQAOS_EXECUTION_QUEUE_PROVIDER:redis}
  artifacts:
    # ENT-5 (ADR-068): default local single-host store (unchanged). Set AIQAOS_ARTIFACTS_STORE=object +
    # AIQAOS_ARTIFACTS_OBJECT_PROVIDER=s3 with the compose MinIO up to store artifacts durably in shared
    # object storage (cross-host reachable — the SCALE-1 artifact unblock at the storage layer).
    store: ${AIQAOS_ARTIFACTS_STORE:local}
    upload:
      # FI-ENT5-A (ADR-071): default OFF. Set AIQAOS_ARTIFACTS_UPLOAD_ENABLED=true (with store=object +
      # object.provider=s3) so ExecutionStep pushes produced artifact files into the durable ArtifactStore
      # — cross-host reachable. Best-effort; never fails an execution.
      enabled: ${AIQAOS_ARTIFACTS_UPLOAD_ENABLED:false}
    object:
      provider: ${AIQAOS_ARTIFACTS_OBJECT_PROVIDER:in-memory}
      s3:
        # SEC-2: creds injected from env/.env (MinIO dev defaults), never committed. MinIO needs path-style.
        bucket: ${AIQAOS_ARTIFACTS_S3_BUCKET:aiqaos-artifacts}
        endpoint: ${AIQAOS_ARTIFACTS_S3_ENDPOINT:http://localhost:9000}
        region: ${AIQAOS_ARTIFACTS_S3_REGION:us-east-1}
        access-key: ${AIQAOS_ARTIFACTS_S3_ACCESS_KEY:${MINIO_ROOT_USER:minioadmin}}
        secret-key: ${AIQAOS_ARTIFACTS_S3_SECRET_KEY:${MINIO_ROOT_PASSWORD:minioadmin}}
        path-style-access: true
  memory:
    shortterm:
      provider: redis               # T5: RedisMemoryStore (starter present via brain->memory);
                                     # Spring Boot's auto RedisHealthIndicator surfaces it at /actuator/health
    vector:
      provider: in-memory           # QdrantStoreClient is a stub — keep the validated in-memory store
  security:
    # Frictionless local dev by default; set AIQAOS_SECURITY_ENABLED=true to exercise SEC-1 auth.
    enabled: ${AIQAOS_SECURITY_ENABLED:false}
