server:
  port: 8082

# MNT-6 + OBS-1: surface the MDC correlationId and traceId on every log line (log↔trace correlation).
logging:
  pattern:
    level: "%5p [%X{correlationId:-}] [%X{traceId:-}]"

spring:
  application:
    name: ai-qa-os-gateway
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_qa_os_dashboard?preferQueryMode=simple}
    # SEC-2: credentials injected from env/secret store.
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    # SCALE-4: per-service pool sizing — the gateway fronts the workflow write path (write-leaning).
    hikari:
      pool-name: gateway-pool
      maximum-pool-size: ${AIQAOS_DB_POOL_MAX:20}
      minimum-idle: ${AIQAOS_DB_POOL_MIN:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
    show-sql: false
    open-in-view: false
  flyway:
    # ORG-2: ai-qa-os-gateway is the primary owner for canonical schema migrations (V1..V15).
    enabled: ${AIQAOS_FLYWAY_ENABLED:true}
    baseline-on-migrate: true

# SEC-2: JWT signing secret injected from env/secret store (no committed value).
# Required when aiqaos.security.enabled=true; otherwise a non-persistent ephemeral key is used.
security:
  jwt:
    secret: ${JWT_SECRET:}

qa:
  max-tokens:
    qa-analysis: 4096
    test-case-generation: 4096
    script-generation: 8192

aiqaos:
  provider:
    gemini:
      model: gemini-3.6-flash
  security:
    # SEC-1: deny-by-default authentication enforcement. Override to false (e.g. via
    # AIQAOS_SECURITY_ENABLED=false) for open local development.
    enabled: ${AIQAOS_SECURITY_ENABLED:true}
    database-enabled: true
    # SEC-1: bootstrap admin is created only if absent and a password is supplied here (inject via
    # env/secret, never commit a real value — full secret management is SEC-2).
    bootstrap-admin:
      username: ${AIQAOS_BOOTSTRAP_ADMIN_USERNAME:admin}
      email: ${AIQAOS_BOOTSTRAP_ADMIN_EMAIL:admin@aiqaos.local}
      password: ${AIQAOS_BOOTSTRAP_ADMIN_PASSWORD:}
  cloud:
    gateway:
      routes:
        - id: brain-service
          uri: http://localhost:8081
          predicates:
            - Path=/brain/**
        - id: agent-service
          uri: http://localhost:8082
          predicates:
            - Path=/agents/**

# OBS-2: Expose Prometheus scrape endpoint at /actuator/prometheus.
# Prometheus service is configured to scrape this every 15s (see deployment/observability/prometheus.yml).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      # Common labels applied to every metric — enables Grafana dashboard filtering by service
      application: ai-qa-os-gateway
      environment: ${AIQAOS_ENV:local}
